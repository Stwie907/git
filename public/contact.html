<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>醇香咖啡师 | 联系我们</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header>
    <nav>
      <a href="/" class="logo">醇香咖啡师</a>
      <ul class="nav-links">
        <li><a href="/">首页</a></li>
        <li><a href="/about.html">关于我们</a></li>
        <li><a href="/menu.html">咖啡菜单</a></li>
        <li><a href="/contact.html" class="active">联系我们</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section class="hero">
      <h1>联系我们</h1>
      <p class="tagline">期待听到您的声音，欢迎随时留言咨询</p>
    </section>

    <section class="contact-layout">
      <div class="contact-info">
        <h2>店铺信息</h2>
        <p class="lead">
          无论是预约咖啡体验课程、反馈建议，还是单纯想聊聊咖啡，
          都欢迎通过以下方式与我们联系。
        </p>

        <h3>地址</h3>
        <p>上海市静安区咖啡街 88 号</p>

        <h3>营业时间</h3>
        <p>周一至周五：08:00 - 21:00</p>
        <p>周六至周日：09:00 - 22:00</p>

        <h3>联系电话</h3>
        <p>021-1234-5678</p>

        <h3>电子邮箱</h3>
        <p>hello@chunxiangcoffee.com</p>
      </div>

      <div class="form-card">
        <h2>在线留言</h2>
        <div id="form-message" class="message" role="alert"></div>
        <form id="contact-form" action="/api/contact" method="POST">
          <div class="form-group">
            <label for="name">姓名</label>
            <input type="text" id="name" name="name" required placeholder="请输入您的姓名">
          </div>
          <div class="form-group">
            <label for="email">邮箱</label>
            <input type="email" id="email" name="email" required placeholder="example@email.com">
          </div>
          <div class="form-group">
            <label for="message">留言内容</label>
            <textarea id="message" name="message" required placeholder="请输入您想咨询或反馈的内容"></textarea>
          </div>
          <button type="submit">提交留言</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 醇香咖啡师. 保留所有权利.</p>
  </footer>

  <script src="/js/contact.js"></script>
</body>
</html>
